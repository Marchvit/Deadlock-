# Собирает приложение для Windows (установщик .exe и .msi) и Android (.apk).
# Запускается при каждой загрузке файлов в ветку main, вручную (Actions → Run workflow)
# и при создании тега вида v1.0.1 (тогда ещё и публикуется релиз со всеми файлами).
# Проект можно загрузить как папку или одним файлом deadlock-counterpick-rust.zip (удобно с телефона).

name: Сборка приложений

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект, если он загружен одним zip-архивом
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.toml)) {
            $z = Get-ChildItem -Filter *.zip | Select-Object -First 1
            if (-not $z) { Write-Error "Нет ни файлов проекта, ни zip-архива. Загрузи deadlock-counterpick-rust.zip в репозиторий."; exit 1 }
            Expand-Archive -Path $z.FullName -DestinationPath _src -Force
            $root = Get-ChildItem _src -Directory | Select-Object -First 1
            Copy-Item -Path (Join-Path $root.FullName '*') -Destination . -Recurse -Force
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установить Tauri CLI
        run: npm install

      - name: Собрать
        run: npx tauri build

      - name: Собрать файлы для скачивания
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item src-tauri/target/release/deadlock-counterpick.exe out/DeadlockCounterpick-portable.exe -ErrorAction SilentlyContinue
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект, если он загружен одним zip-архивом
        run: |
          if [ ! -f src-tauri/Cargo.toml ]; then
            Z=$(ls -1 *.zip 2>/dev/null | head -1)
            if [ -z "$Z" ]; then echo "::error::Нет ни файлов проекта, ни zip-архива. Загрузи deadlock-counterpick-rust.zip в репозиторий."; exit 1; fi
            unzip -q -o "$Z" -d _src
            ROOT=$(find _src -mindepth 1 -maxdepth 1 -type d | head -1)
            cp -r "$ROOT"/. .
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK и NDK уже установлены на сервере GitHub: берём самый новый NDK
      - name: Найти Android SDK и NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK=$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/*$::')
          [ -z "$NDK" ] && NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            echo "NDK не найден, устанавливаю"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi
          echo "SDK: $SDK"
          echo "NDK: $NDK"
          ls "$SDK/build-tools" | tail -3
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установить Tauri CLI
        run: npm install

      - name: Создать Android-проект и иконки
        run: |
          npx tauri android init
          npx tauri icon src-tauri/icons/icon.png

      - name: Собрать APK (arm64 и armv7, подходит почти всем телефонам)
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Подписать APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          echo "APK: $APK"
          mkdir -p out key
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "Подпись постоянным ключом из секретов"
            echo "$KS_B64" | base64 -d > release.jks
            PASS="$KS_PASS"
          else
            echo "Секретов нет: создаю новый ключ подписи (см. README, раздел про ключ)"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -alias app -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Deadlock Counterpick"
            base64 -w0 release.jks > key/ANDROID_KEYSTORE_B64.txt
            printf '%s' "$PASS" > key/ANDROID_KEYSTORE_PASSWORD.txt
          fi
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias app \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out out/DeadlockCounterpick.apk aligned.apk
          "$BT/apksigner" verify --print-certs out/DeadlockCounterpick.apk
          rm -f release.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/DeadlockCounterpick.apk

      - name: Сохранить ключ подписи (только при первой сборке)
        if: hashFiles('key/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-key
          path: key/*
          retention-days: 3

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      # Ключ подписи в релиз никогда не попадает: качаем только эти два архива
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: files
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          
